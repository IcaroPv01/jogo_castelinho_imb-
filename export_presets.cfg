html/head_include="<meta name='viewport' content='width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover'>
<meta name='apple-mobile-web-app-capable' content='yes'>
<meta name='mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-status-bar-style' content='black'>
<style>html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}#canvas{touch-action:none;}</style>
<script>
(function(){
 /* modulo 8 (celular): som destravado no 1o toque, entalhe da tela e deteccao de toque */
 var AC=window.AudioContext||window.webkitAudioContext; var ctxs=[];
 if(AC){ var W=function(o){ var c=(o===undefined)?new AC():new AC(o); ctxs.push(c); return c; }; W.prototype=AC.prototype; window.AudioContext=W; if(window.webkitAudioContext){ window.webkitAudioContext=W; } }
 function destravar(){ try{ if(navigator.audioSession){ navigator.audioSession.type='playback'; } }catch(e){} for(var i=0;i<ctxs.length;i++){ if(ctxs[i].state!=='running'){ try{ ctxs[i].resume(); }catch(e){} } } }
 ['touchstart','touchend','pointerdown','click','keydown'].forEach(function(t){ document.addEventListener(t,destravar,true); });
 window.castelinhoToque=function(){ var q=new URLSearchParams(location.search).get('celular'); if(q==='1'){ return true; } if(q==='0'){ return false; } return !!(window.matchMedia && matchMedia('(pointer: coarse)').matches && (navigator.maxTouchPoints||0)>0); };
 window.castelinhoIOS=function(){ return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && (navigator.maxTouchPoints||0)>1); };
 window.castelinhoSeguro=function(){ var d=document.createElement('div'); d.style.cssText='position:fixed;left:0;top:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);visibility:hidden;pointer-events:none'; document.body.appendChild(d); var s=getComputedStyle(d); var r=[s.paddingLeft,s.paddingTop,s.paddingRight,s.paddingBottom].map(function(v){ return parseFloat(v)||0; }); d.remove(); return JSON.stringify({l:r[0],t:r[1],r:r[2],b:r[3],w:window.innerWidth,h:window.innerHeight}); };
})();
</script>"
